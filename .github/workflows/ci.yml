name: CI

on:
  push:
    branches: [main]
  pull_request:

# One CI run per ref; newer pushes cancel older in-flight runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (worker)
        run: npm run typecheck
      - name: Typecheck (web)
        run: npm run typecheck:web
      - name: Unit + integration tests
        run: npm test
      # Order matters and is load-bearing: build-site does rmSync(dist/site), so it
      # MUST run before build-web (which writes dist/site/app) or the SPA is wiped.
      # CI builds in the SAME order as deploy.yml so the real artifact layout is
      # validated on every PR, not discovered in production.
      - name: Build the static site (verifies it compiles with an empty DB)
        run: npm run build-site
      - name: Build the web app
        run: npm run build-web
      - name: Build thebay.news assets
        run: npm run build-news
      - name: Verify the built artifact layout
        run: test -f dist/site/index.html && test -f dist/site/app/index.html && test -f dist/news/asset-manifest.json
