name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual "Run workflow"

# Never run two production deploys at once.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:web
      - run: npm test

  deploy:
    name: Deploy to Cloudflare
    needs: verify # only deploy if the whole suite is green
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      # Order matters: build-site does rmSync(dist/site), so it MUST run before
      # build-web — otherwise it wipes the freshly-built React app at dist/site/app
      # and /app falls back to serving the dashboard shell.
      - name: Build the classic dashboard shell
        run: npm run build-site
      - name: Build the React app (/app)
        run: npm run build-web
      # thebay.news assets. Separate tree (dist/news), so order-independent — but
      # kept here so one deploy always ships both halves of The Bay together.
      - name: Build thebay.news assets
        run: npm run build-news
      - name: Verify the artifact layout
        run: test -f dist/site/index.html && test -f dist/site/app/index.html && test -f dist/news/asset-manifest.json

      # The dashboard's event data is produced by the local scraper (residential IP
      # required), not in CI — so preserve the live events.json instead of shipping
      # an empty one. The daily local job refreshes the full dataset.
      - name: Preserve live event data
        run: curl -sf https://thebay.events/events.json -o dist/site/events.json || echo "no live events.json yet"

      - name: Deploy thebay.events worker + assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Separate Worker, separate deploy: a news failure must not be able to take
      # the events site with it. Deployed second for the same reason.
      - name: Deploy thebay.news worker + assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c wrangler.news.jsonc

      # Prove the just-shipped deployment actually serves: health, the REAL /app
      # bundle (guards the build-order regression), security headers, pagination,
      # and the no-auth gates. PROD_LIGHT creates zero data, so it's safe every run.
      - name: Smoke-test the live deployment
        run: |
          # A brand-new route can lag a few seconds propagating to every edge after
          # wrangler returns. Poll a stable JSON endpoint until the new version is
          # live (≤60s) so the smoke doesn't race the rollout and hit the old worker.
          echo "waiting for the new version to propagate…"
          for i in $(seq 1 20); do
            if curl -sf https://thebay.events/api/scrape-status | grep -q '"totalEvents"'; then echo "live after ~$((i*3))s"; break; fi
            sleep 3
          done
          PROD_LIGHT=1 node tests/prod-e2e.mjs
        env:
          BASE: https://thebay.events

      # thebay.news: proves the page is complete WITHOUT JavaScript (the whole
      # reason it's server-rendered), that the hashed bundle it references really
      # exists, and that the news domain never serves the events site.
      - name: Smoke-test thebay.news
        run: |
          echo "waiting for thebay.news to propagate…"
          for i in $(seq 1 20); do
            if curl -sf https://thebay.news/robots.txt | grep -q "thebay.news/sitemap.xml"; then echo "live after ~$((i*3))s"; break; fi
            sleep 3
          done
          node tests/news-prod-e2e.mjs
        env:
          NEWS_BASE: https://thebay.news
          BASE: https://thebay.events
