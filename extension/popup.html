<!doctype html>
<meta charset="utf-8" />
<title>The Bay — Scrape Worker</title>
<style>
  :root { color-scheme: light dark; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  body { width: 320px; margin: 0; padding: 14px; }
  h1 { font-size: 14px; margin: 0 0 2px; letter-spacing: -0.01em; }
  p.sub { margin: 0 0 12px; opacity: 0.65; font-size: 12px; }
  label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.6; margin: 10px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid rgba(128,128,128,0.4); border-radius: 6px; background: transparent; color: inherit; font: inherit; }
  button { margin-top: 12px; width: 100%; padding: 8px; border: 0; border-radius: 6px; background: #3b82f6; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button.off { background: #6b7280; }
  #status { margin-top: 12px; padding: 8px; border-radius: 6px; background: rgba(128,128,128,0.12); font-size: 12px; white-space: pre-wrap; min-height: 2.6em; }
  .row { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; margin-top: 10px; font-size: 12px; }
  .row b { font-variant-numeric: tabular-nums; }
</style>
<h1>The Bay — Scrape Worker</h1>
<p class="sub">Finds Bay Area events from your own connection. Nothing runs until you switch it on.</p>
<label for="url">Site</label>
<input id="url" placeholder="https://thebay.events" />
<label for="token">Worker token</label>
<input id="token" type="password" placeholder="from Register this browser" />
<button id="toggle">Start working</button>
<div class="row"><span>Jobs done</span><b id="jobs">0</b></div>
<div class="row"><span>Events found</span><b id="found">0</b></div>
<div class="row"><span>Standing</span><b id="tier">—</b></div>
<div id="status">Idle.</div>
<script type="module" src="popup.js"></script>
